<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felt Ghost States</title>
<style>
  :root { --bg: #0b0a1f; --fg: #e9e4ff; --muted: #a9a3d8; --panel: rgba(11, 10, 31, .74); --line: rgba(233, 228, 255, .16); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 12px; bottom: 12px; background: var(--panel); padding: 10px 12px; border-radius: 10px; width: 236px; }
  #ui[hidden], #live-ui[hidden] { display: none; }
  #ui b { font-size: 14px; }
  #ui label { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
  .row { display: flex; gap: 6px; margin: 8px 0; }
  .muted { color: var(--muted); }
  button { font: inherit; color: var(--fg); background: rgba(233, 228, 255, .06); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: rgba(233, 228, 255, .14); }
  button.on { background: rgba(185, 168, 255, .3); border-color: rgba(185, 168, 255, .6); }
  #casts button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; flex: 1; }
  #casts img { width: 34px; height: 34px; }
  #casts span { font-size: 11px; color: var(--muted); }
  #spawn { width: 100%; margin-top: 6px; }
  pre { font: 12px/1.5 ui-monospace, monospace; margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); white-space: pre-wrap; }
</style>
</head>

<canvas id="c"></canvas>
<div id="ui">
  <b>Felt ghost · state machine</b>
  <div class="row"><button data-mode="live" class="on">Live</button><button data-mode="lineup">Lineup</button></div>
  <div id="live-ui">
    <div class="muted">Cast a symbol: it hits every ghost whose first symbol matches.</div>
    <div class="row" id="casts"></div>
    <label><input type="checkbox" id="auto" checked> auto-play</label>
    <label><input type="checkbox" id="slow"> slow motion</label>
    <label><input type="checkbox" id="labels" checked> state labels</label>
    <button id="spawn">Spawn ghost (S)</button>
    <div class="muted" style="margin-top:6px">Space pauses.</div>
  </div>
  <pre class="muted">spawn → approach
approach ⇄ hit  (blinks when idle)
last symbol → banish → poof
reaches you → boo</pre>

  function circle(n = 48) {
    return Array.from({ length: n + 1 }, (_, i) => {
      const a = -Math.PI / 2 + i / n * Math.PI * 2;
      return { x: 50 + Math.cos(a) * 34, y: 50 + Math.sin(a) * 34 };
    });
  }
  function heart(n = 64) {
    return Array.from({ length: n + 1 }, (_, i) => {
      const t = i / n * Math.PI * 2;
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x: 50 + x * 2.55, y: 50 + (-y - 2.5) * 2.55 };
    });
  }
  var P = (pts) => pts.map(([x, y]) => ({ x, y }));
  var SYMBOLS = {
    dash: { name: "Dash", color: "#ff6f91", glyph: P([[16, 50], [84, 50]]) },
    pillar: { name: "Pillar", color: "#6fd6ff", glyph: P([[50, 16], [50, 84]]) },

    moon: { name: "Moon", color: "#c7b3ff", glyph: circle() },
    bolt: { name: "Bolt", color: "#ffd36b", glyph: P([[64, 10], [32, 52], [66, 48], [36, 90]]) },
    heart: { name: "Heart", color: "#ff3b4e", glyph: heart() }
  };
  var GHOST = {
    /** body width as a fraction of the 16:9 frame width; each extra symbol makes it a little bigger */
    size: 0.09,
    perSymbol: 0.1,
    /** the big one: same ghost, scaled up, a long row of symbols */
    big: 1.7,
    /** approach speed in frame widths per second, before difficulty */
    speed: 0.056,
    /** how close (frame widths, centre to lantern) counts as reaching you */
    reach: 0.085,
    /** a hit's shove away from you, in frame widths per second: about a quarter of a body width all told */
    knockback: 0.04
  };

  // src/game/ghost.ts
  var SLICES = 30;
  var FREEZE = 0.13;
  var FADE = 0.24;
  var BOO = 0.5;
  var HIT = 0.38;
  var BLINK = 0.12;
  var rnd = (a, b) => a + Math.random() * (b - a);
  var clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  var smooth = (a, b, v) => {
    const q = clamp((v - a) / (b - a), 0, 1);
    return q * q * (3 - 2 * q);
  };
  var outBack = (q) => 1 + 2.4 * (q - 1) ** 3 + 1.4 * (q - 1) ** 2;
  var outCubic = (q) => 1 - (1 - q) ** 3;
  var scratch = null;
  function scratchFor(w, h) {
    if (!scratch) scratch = document.createElement("canvas");
    if (scratch.width < w || scratch.height < h) {
      scratch.width = Math.max(scratch.width, w);
      scratch.height = Math.max(scratch.height, h);
    }
    return scratch;
  }
  var Ghost = class {
    constructor(queue, w, scale = 1, at) {
      this.scale = scale;
      this.slots = queue.map((id, i) => ({ id, x: i }));
      this.rowC = (queue.length - 1) / 2;
      this.max = queue.length;
      this.born = w.t;
      this.nextBlink = w.t + rnd(1, 3.5);
      if (at) {
        this.x = at.x;
        this.y = at.y;
      } else {
        const a = Math.PI + 0.3 + Math.random() * (Math.PI - 0.6);
        this.x = w.W * 0.5 + Math.cos(a) * w.W * 0.64;
        this.y = w.ty + Math.sin(a) * w.H * 0.98;
      }
      this.d0 = Math.max(w.U * 0.3, Math.hypot(this.x - w.tx, this.y - w.ty));
    }
    x = 0;
    y = 0;
    vx = 0;
    vy = 0;
    lean = 0;
    /** squash spring: positive is wide and short */
    sq = 0;
    sqv = 0;
    ph = rnd(0, 6.28);
    ph2 = rnd(0, 6.28);
    pace = rnd(0.88, 1.12);
    born;
    hitT = -9;
    deadT = 0;
    d0 = 1;
    blinkT = -9;
    nextBlink;
    state = "live";
    slots;
    /** the row's centre, eased so the row slides when a symbol comes off */
    rowC;
    max;
    /** hover around this point instead of approaching (tutorial, title screen) */
    home = null;
    burst = false;
    get live() {
      return this.state === "live";
    }
    get front() {
      return this.slots[0]?.id;
    }
    get queue() {
      return this.slots.map((s) => s.id);
    }
    /** Take the front symbol off. Returns where its glyph was drawn, so the effect can pick it up from there. */
    strip(w, art) {
      const at = this.glyphAt(w, art, 0);
      const s = this.slots.shift();
      if (!s) return null;
      for (const o of this.slots) o.x -= 1;
      this.rowC -= 1;
      return { id: s.id, ...at };
    }
    /** It lost a symbol but is still here: flinch back, squash, flash. */
    flinch(w) {
      this.hitT = w.t;
      this.sqv += 5.5;
      const dx = this.x - w.tx, dy = this.y - w.ty, d = Math.hypot(dx, dy) || 1;
      this.vx += dx / d * w.U * GHOST.knockback;
      this.vy += dy / d * w.U * GHOST.knockback;
    }
    banish(w) {
      this.state = "dying";
      this.deadT = w.t;
      this.hitT = w.t;
      this.slots = [];
      this.sqv += 6;
    }
    update(w) {
      const t = w.t, dt = w.dt, U = w.U, age = t - this.born, since = t - this.deadT;
      let event = null;
      if (this.state === "live") {
        let vx, vy;
        if (this.home) {
          const hx = this.home.x + Math.sin(t * 0.55 + this.ph) * U * 0.012, hy = this.home.y + Math.sin(t * 0.8 + this.ph2) * U * 6e-3;

          vy = (hy - this.y) * 2.4;
        } else {
          let dx = w.tx - this.x, dy = w.ty - this.y;

          dy /= d;

          vy = dy * sp + dx * lat;

            this.deadT = t;
            this.sqv -= 3;
            event = "reached";
          }

        for (const o of w.ghosts) {

            vy += oy / od * f;

        this.vy += (vy - this.vy) * k;

          this.nextBlink = t + rnd(2, 5);
        }

        this.vx *= Math.max(0, 1 - dt * 14);
        this.vy *= Math.max(0, 1 - dt * 14);

          this.burst = true;
          event = "burst";
        }
        if (since > FREEZE + FADE) {
          this.state = "gone";
          return "remove";
        }
      } else if (this.state === "boo") {
        this.vx *= Math.max(0, 1 - dt * 6);
        this.vy *= Math.max(0, 1 - dt * 6);
        if (since > BOO) {
          this.state = "gone";
          return "remove";
        }
      }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      const leanT = clamp(this.vx / U * 2.4, -0.24, 0.24) + Math.sin(t * 0.8 + this.ph) * 0.025;
      this.lean += (leanT - this.lean) * Math.min(1, dt * 5);
      this.sqv += (-this.sq * 150 - this.sqv * 10) * Math.min(dt, 0.033);
      this.sq += this.sqv * Math.min(dt, 0.033);
      for (const [i, s] of this.slots.entries()) s.x += (i - s.x) * Math.min(1, dt * 14);
      this.rowC += ((this.slots.length - 1) / 2 - this.rowC) * Math.min(1, dt * 14);
      return event;
    }
    /** on-screen body width and centre */
    box(w) {
      const near = this.home ? 0.4 : 1 - Math.min(1, Math.hypot(this.x - w.tx, this.y - w.ty) / this.d0);
      const n = Math.min(this.max, 3);
      const size = GHOST.size * w.U * this.scale * (1 + GHOST.perSymbol * (n - 1)) * (0.8 + 0.36 * near);

    }
    /** everything that shapes the drawn body this frame */
    pose(w) {
      const t = w.t, age = t - this.born, since = t - this.deadT;
      let alpha = 1, s = 1, jx = 0, flash = 0, face = "idle";
      const bob = Math.sin(t * 1.7 + this.ph) * w.U * 6e-3 * this.scale;

        const q = age / 0.6;
        alpha = Math.min(1, q * 1.6);
        s *= 0.5 + 0.5 * outBack(q);
      }
      if (this.state === "live") {
        const ht = t - this.hitT;
        face = ht < HIT ? "hit" : t - this.blinkT < BLINK ? "blink" : "idle";

          jx = Math.sin(since * 110) * w.U * 45e-4 * (1 - q);
          flash = 0.85 * (1 - q);
          s *= 1.05;

          const q = Math.min(1, (since - FREEZE) / FADE);
          alpha = 1 - q * q;
          s *= 1.05 + 0.25 * outCubic(q);
          sy *= 1 + 0.14 * q;
          sx *= 1 - 0.06 * q;
        }

        const q = Math.min(1, since / BOO);
        face = "boo";
        s *= 1 + 0.6 * outCubic(q);
        alpha = q < 0.45 ? 1 : 1 - (q - 0.45) / 0.55;
      }
      return { alpha, s, sx, sy, jx, bob, flash, face };
    }
    /** The hem's sideways offset at height v (0 top, 1 bottom), as a fraction of the body width. */
    wave(v, t, U) {
      const tail = smooth(0.42, 1, v);
      const drift = clamp(this.vx / U, -0.35, 0.35);
      return tail * (0.026 * Math.sin(t * 3 + this.ph - v * 5.5) + 0.01 * Math.sin(t * 5.1 + this.ph2 - v * 9)) - tail * tail * drift * 0.5;
    }
    draw(ctx, w, art, dpr) {
      if (this.state === "gone") return;
      const r = art.rig, p = this.pose(w);

      s.fillStyle = `rgba(${HAZE[0]}, ${HAZE[1]}, ${HAZE[2]}, ${0.05 + 0.17 * z})`;
      s.fillRect(x, y, cw / dpr, ch / dpr);
      s.globalCompositeOperation = "source-over";
      return {
        c,
        x,
        y,
        cw,
        ch,
        wts: weights(g, n),
        alpha: 0.96 - 0.12 * z,
        blur: 2.4 * z * w.U / 1920,
        bright: 0.97 - 0.13 * z,
        // the glow sits on the live body; the boo and the poof go without it rather than leave it hanging
        W0,
        gx: g.x,
        gy: g.y,
        glow: g.live ? Math.min(1, (w.t - g.born) / 0.6) : 0
      };
    }
    const hp = Math.round(bw * 0.35), halo = document.createElement("canvas");
    halo.width = bw + hp * 2;
    halo.height = bh + hp * 2;
    const hg = halo.getContext("2d");
    hg.filter = `blur(${bw * 0.1}px)`;
    hg.drawImage(flash, hp, hp);
    function paint(sh, wt, dpr) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = sh.alpha * wt;
      ctx.filter = `${sh.blur > 0.25 ? `blur(${sh.blur * dpr}px) ` : ""}brightness(${sh.bright})`;
      ctx.drawImage(sh.c, 0, 0, sh.cw, sh.ch, sh.x * dpr, sh.y * dpr, sh.cw, sh.ch);
      ctx.filter = "none";
      if (sh.glow > 0) {
        const k = sh.W0 / bw, hw = halo.width * k, hh = halo.height * k;
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.16 * sh.alpha * wt * sh.glow;
        ctx.drawImage(halo, (sh.gx - hw / 2) * dpr, (sh.gy - hh / 2) * dpr, hw * dpr, hh * dpr);
        ctx.globalCompositeOperation = "source-over";
      }
      ctx.globalAlpha = 1;
    }
    function resize() {
      w.W = innerWidth;
      w.H = innerHeight;
      w.U = Math.min(w.W, w.H * 16 / 9);
      w.tx = w.W * 0.5;
      w.ty = w.H * 0.46;
    }
    const strip = qs.get("strip") === "death" ? [0.03, 0.1, 0.16, 0.22, 0.3, 0.4, 0.5, 0.62, 0.74] : null;
    function lineup() {
      w.ghosts = [];
      pops.list = [];
      if (strip) {
        held = strip.map((since, i) => {
          const x = w.W * (i + 0.5) / strip.length, y = w.H * 0.55;
          const g = new FeltGhost([], w, 1, { x, y });
          g.home = { x, y };
          w.ghosts.push(g);
          return { g, hold: "banish", x, y, since };
        });
        return;
      }
      held = HOLDS.map(([h], i) => {
        const x = w.W * (i + 0.5) / HOLDS.length, y = w.H * 0.5;
        const g = new FeltGhost(QUEUES[h], w, 1, { x, y });
        g.home = { x, y };
        w.ghosts.push(g);
        return { g, hold: h, x, y };
      });
    }
    function setMode(m) {
      mode = m;
      document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
      $("live-ui").hidden = m !== "live";
      if (m === "lineup") lineup();
      else {
        w.ghosts = [];
        pops.list = [];
        nextSpawn = w.t + 0.3;
        nextCast = w.t + 2;
      }
    }
    function spawn() {
      const n = Math.random() < 0.4 ? 1 : Math.random() < 0.6 ? 2 : 3, m = w.U * 0.07, r = Math.random();
      const at = r < 0.2 ? { x: rnd2(0.2, 0.8) * w.W, y: w.H * 0.28 } : { x: r < 0.6 ? m : w.W - m, y: rnd2(0.28, 0.75) * w.H };
      const g = new FeltGhost(Array.from({ length: n }, () => pick(CAST)), w, 1, at);
      if (Math.random() < 0.25) spared.add(g);
      w.ghosts.push(g);
    }
    function cast(id) {
      if (mode !== "live") return;
      let killed = 0;
      for (const g of w.ghosts.filter((g2) => g2.live && g2.front === id)) {
        const s = g.strip(w, art);
        if (s) pops.add(art.glyphs[s.id], s.x, s.y, s.size);
        if (g.slots.length) g.flinch(w);
        else {
          g.banish(w);
          killed++;
        }
      }
      if (killed) stopUntil = clock + (killed > 1 ? 0.09 : 0.055);
    }
    $("casts").innerHTML = CAST.map((id, i) => `<button data-cast="${id}" title="${SYMBOLS[id].name} (${i + 1})"><img src="${SYM}${id}.webp" alt=""><span>${i + 1}</span></button>`).join("");
    document.querySelectorAll("[data-cast]").forEach((b) => {
      b.onclick = () => cast(b.dataset.cast);
    });
    document.querySelectorAll("[data-mode]").forEach((b) => {
      b.onclick = () => setMode(b.dataset.mode);
    });
    $("spawn").onclick = () => mode === "live" && spawn();
    let paused = false;
    addEventListener("keydown", (e) => {
      const i = "1234".indexOf(e.key);
      if (i >= 0) cast(CAST[i]);
      if (e.key === "s" || e.key === "S") $("spawn").click();
      if (e.key === " ") {
        paused = !paused;
        e.preventDefault();
      }
    });
    const auto = $("auto"), slow = $("slow"), labels = $("labels");
    addEventListener("resize", () => {
      resize();
      if (mode === "lineup") lineup();
    });
    resize();
    if (qs.has("noui")) $("ui").hidden = true;
    setMode(qs.get("mode") === "lineup" ? "lineup" : "live");
    function step(dt) {
      clock += dt;
      w.dt = clock < stopUntil ? 0 : dt;
      w.t += w.dt;
      const t = w.t;
      if (mode === "live") {
        const alive = w.ghosts.filter((g) => g.live);
        if (t > nextSpawn && alive.length < 5) {
          spawn();
          nextSpawn = t + rnd2(1.5, 2.6);
        }
        if (auto.checked && t > nextCast) {
          nextCast = t + rnd2(0.9, 1.5);
          const d = (g) => Math.hypot(g.x - w.tx, g.y - w.ty);
          const ready = alive.filter((g) => t - g.born > 1.3 && g.front && !spared.has(g) && g.x > 0 && g.x < w.W && g.y > 0 && g.y < w.H).sort((a, b) => d(a) - d(b));
          if (ready.length) cast(ready[0].front);
        }
      } else for (const h of held) {
        if (h.since === void 0) hold(h.g, h.hold, t);
        else {
          h.g.state = "dying";
          h.g.deadT = t - h.since;
        }
      }
      for (let i = w.ghosts.length - 1; i >= 0; i--) {
        const ev = w.ghosts[i].update(w);
        if (ev === "reached") hurtT = clock;
        else if (ev === "remove") w.ghosts.splice(i, 1);
      }
      pops.update(w.dt);
    }
    function render() {
      const dpr = Math.min(devicePixelRatio || 1, 2), W = w.W, H = w.H, t = w.t;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#0b0a1f";
      ctx.fillRect(0, 0, cv.width, cv.height);
      const order = [...w.ghosts].sort((a, b) => a.box(w).w - b.box(w).w);
      const fit = sceneFit(W, H), shots = order.map((g) => shoot(g, dpr, fit));
      drawScene(ctx, W, H, dpr, clock, glow, fly, (i) => {
        for (const slot of SLOTS) if (SLOT_AFTER[slot] === i) {
          for (const sh of shots) if (sh.wts[slot] > 0.01) paint(sh, sh.wts[slot], dpr);
        }
      });
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (const g of order) g.drawSymbols(ctx, w, art);
      pops.draw(ctx);
      if (mode === "lineup") {
        if (strip) for (const h of held) pill(ctx, h.x, h.y + GHOST.size * w.U * 0.9, `${Math.round(h.since * 1e3)} ms`);
        else for (const [i, [, title, sub]] of HOLDS.entries()) pill(ctx, held[i].x, held[i].y + GHOST.size * w.U * 0.7, title, sub);
      } else if (labels.checked) {
        for (const g of w.ghosts) if (g.state !== "gone") pill(ctx, g.x, g.y + g.box(w).w * rig.aspect * 0.55, stateOf(g, t));
      }
      const k = Math.max(0, 1 - (clock - hurtT) / 0.6);
      if (k > 0) {
        const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
        gr.addColorStop(0, "rgba(255, 90, 120, 0)");
        gr.addColorStop(1, `rgba(255, 90, 120, ${0.35 * k})`);
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);
      }
      if (paused) pill(ctx, W / 2, 14, "PAUSED \xB7 space to resume");
    }
    const FIND = {
      spawn: () => w.ghosts.some((g) => g.live && w.t - g.born > 0.2),
      hit: () => w.ghosts.some((g) => g.live && w.t - g.hitT > 0.06 && w.t - g.hitT < 0.2),
      banish: () => w.ghosts.some((g) => g.state === "dying" && w.t - g.deadT > 0.05),
      poof: () => w.ghosts.some((g) => g.state === "dying" && w.t - g.deadT > POP + +(qs.get("at") ?? 0.14)),
      boo: () => w.ghosts.some((g) => g.state === "boo" && w.t - g.deadT > 0.12),
      far: () => w.ghosts.filter((g) => g.live && w.t - g.born > 0.8 && progress(g) < 0.25).length >= 2,
      mid: () => w.ghosts.some((g) => g.live && progress(g) > 0.4 && progress(g) < 0.55)
    };
    const find = FIND[qs.get("find") ?? ""];
    if (find && mode === "live") {
      for (let i = 0; i < 60 * 120 && !find(); i++) step(1 / 60);
      paused = true;
    }
    let last = performance.now();
    function frame(now) {
      let dt = Math.min(0.05, (now - last) / 1e3);
      last = now;
      if (slow.checked) dt *= 0.3;
      if (!paused) step(dt);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  boot().catch((e) => {
    document.body.insertAdjacentHTML("beforeend", `<p style="position:fixed;bottom:8px;left:12px">${String(e.message ?? e)}</p>`);
  });
})();
</script>
</body>
</html>
